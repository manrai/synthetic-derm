[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synderm"
version = "0.2.0.dev0"
description = "A package for generating synthetic data to augment image classifiers."
authors = [
    { name="Thomas Buckley", email="32546943+2v@users.noreply.github.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "diffusers>=0.42.0.dev0",
    "transformers>=5.17",
    "accelerate>=1.0",
    "peft>=0.14",
    "timm>=1.0",
    "datasets>=3.0",
    "huggingface_hub>=1.0",
    "webdataset>=0.2",
    "bitsandbytes>=0.45",
    "safetensors>=0.4",
    "Pillow>=10.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "requests>=2.28",
    "tqdm>=4.60",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/manrai/synthetic-derm"
Issues = "https://github.com/manrai/synthetic-derm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["synderm*"]